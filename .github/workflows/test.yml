name : Test Platform

on:
    pull_request:
        branches:
            - main

jobs:
    test:
        strategy:
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build Next.js
              run: bun run build

    page-status:
        name: Check all pages return OK
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build Next.js
              run: bun run build

            - name: Start server and check every page
              run: |
                  bun run start &
                  SERVER_PID=$!

                  for i in $(seq 1 30); do
                    if curl -s -o /dev/null http://localhost:3000; then
                      echo "Server is up"
                      break
                    fi
                    echo "Waiting for server..."
                    sleep 2
                  done

                  bun run check:pages
                  STATUS=$?

                  kill $SERVER_PID
                  exit $STATUS